services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cc_agents
      POSTGRES_USER: cc_agents
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cc_agents_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc_agents -d cc_agents"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cc_agents_postgres:/var/lib/postgresql/data

volumes:
  cc_agents_postgres:

